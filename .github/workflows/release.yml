name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release and upload archives
  id-token: write   # mint the OIDC token the attestation is signed with
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # GoReleaser builds the changelog from history; a shallow clone
          # yields an empty one.
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A PAT with `contents: write` on The-LibreTimes/homebrew-tap. The
          # default GITHUB_TOKEN cannot push to another repository, so without
          # this the cask step is skipped rather than failing the release
          # (skip_upload: auto).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Provenance for the binaries themselves, not the archives: it is the
      # binary a user ends up running, and `gh attestation verify ./lt` is the
      # check they can actually perform after unpacking.
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/lt_*/lt
            dist/lt_*/lt.exe
